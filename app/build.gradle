plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.leehj825.myapp'
    ndkVersion '27.0.12077973'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.leehj825.myapp'
        // Scoped storage (MediaStore RELATIVE_PATH) and MediaRecorder(Context) need Android 10 / 12 APIs handled in code.
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        // The Tavily key comes from the build environment (the GitHub secret TAVILY_API_KEY). It is not in the code.
        buildConfigField 'String', 'GEMINI_API_KEY', "\"${System.getenv('GEMINI_API_KEY') ?: ''}\""
        buildConfigField 'String', 'TAVILY_API_KEY', "\"${System.getenv('TAVILY_API_KEY') ?: ''}\""
        ndk {
            // The Galaxy Z Fold8 and other current phones are 64-bit ARM. Smaller build and APK.
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.mlkit:genai-summarization:1.0.0-beta1'
}
