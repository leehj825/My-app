name: Android debug APK

# Builds My App (the Android app at the repository root) as a debug APK on every push to any branch,
# and on pull requests and on demand. The APK is attached to the run as an artifact.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already has the Android SDK; this installs Gradle itself, so no wrapper is committed
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build the debug APK
        env:
          # Read from the repository secret; it is built into the app and never written to the code.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: gradle --no-daemon assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
