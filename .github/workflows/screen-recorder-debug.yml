name: Screen Recorder debug APK

# Builds the Screen Recorder app (screen-recorder/) as a debug APK and attaches it to the run as an artifact.

on:
  push:
    paths: ['screen-recorder/**', '.github/workflows/screen-recorder-debug.yml']
  pull_request:
    paths: ['screen-recorder/**', '.github/workflows/screen-recorder-debug.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already has the Android SDK; this installs Gradle itself, so no wrapper is committed
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the debug APK
        working-directory: screen-recorder
        run: gradle --no-daemon assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-recorder-debug-apk
          path: screen-recorder/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
